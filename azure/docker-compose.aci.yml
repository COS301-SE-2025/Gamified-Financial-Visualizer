# Azure Container Instances specific deployment
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}

  api-backend:
    image: ${AZURE_REGISTRY}/finance-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - PASETO_LOCAL_KEY=${PASETO_LOCAL_KEY}
      - CMC_APIKEY=${CMC_APIKEY}
      - HF_TOKEN=${HF_TOKEN}
      - CORS_ORIGIN=${FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  ai-service:
    image: ${AZURE_REGISTRY}/finance-ai:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CORS_ORIGIN=${FRONTEND_URL}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  frontend:
    image: ${AZURE_REGISTRY}/finance-frontend:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "80:8080"
    environment:
      - REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL}
      - REACT_APP_AI_API_URL=${REACT_APP_AI_API_URL}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'